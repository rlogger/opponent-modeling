# Reference single-agent TD-MPC2 configuration (Gate 0).
#
# Ported from tdmpc2_jax/config.yaml in ShaneFlandermeyer/tdmpc2-jax, pinned
# commit 5b05ff452424896d709848e1f249bd67e269b8a1. Upstream section and
# parameter names are preserved. Hydra, env, buffer, logging, and tabulate keys
# were dropped because those upstream components are not ported.
#
# Loaded by mopa.tdmpc.load_config. The top-level values are the reference
# defaults and must not be weakened; use ``profiles.smoke`` for fast tests.

seed: 0

# Local Gate 0 settings. Validated at construction only; they reduce to the
# unchanged upstream single-agent computation (Equation 1: x_next = d(x, u)).
action_dim: 2
opponent_mode: implicit
context_dim: 0

encoder:
  # "mlp" is the upstream learned SimNorm encoder; "identity" is the local
  # normalized Markov-state baseline (TD-MPC-style state-space baseline).
  type: mlp
  encoder_dim: 256
  num_encoder_layers: 2
  learning_rate: 1.0e-4

# Local factored-mode red policy head red(x, c) -> v (unused in other modes).
factored:
  red_hidden_dim: 128
  red_loss_scale: 1.0
  red_detach_latent: true

world_model:
  latent_dim: 512
  value_dropout: 0.01
  num_value_nets: 5
  num_bins: 101
  symlog_min: -10
  symlog_max: 10
  simnorm_dim: 8
  learning_rate: 3.0e-4
  predict_continues: false
  dtype: float32
  max_grad_norm: 20

tdmpc2:
  # Planning
  horizon: 3
  mppi_iterations: 6
  population_size: 512
  policy_prior_samples: 24
  num_elites: 64
  min_plan_std: 0.05
  max_plan_std: 2
  temperature: 1.0
  # Optimization
  batch_size: 256
  discount: 0.99
  rho: 0.5
  consistency_loss_scale: 20
  reward_loss_scale: 0.1
  value_loss_scale: 0.1
  continue_loss_scale: 0.0
  entropy_coef: 1.0e-4
  tau: 0.01

# Named override profiles. ``smoke`` shrinks widths and planner population for
# compilation speed in tests only. It is not a replacement for the reference
# configuration above and must never be used for reported results.
# ``gate4`` is the declared local run configuration for the SimpleTag world
# model (CPU budget): capture-aware continuation head, 3-D opponent context,
# reduced widths; the planner defaults are unchanged. ``opponent_mode`` and
# ``encoder.type`` are set per run by scripts/run_tdmpc.py.
profiles:
  # Equation 1 development baseline. Input scaling also applies when explicitly
  # selecting --encoder mlp; the upstream reference and smoke profiles stay raw.
  equation1:
    opponent_mode: implicit
    context_dim: 0
    encoder:
      encoder_dim: 128
      normalize_inputs: true
    world_model:
      latent_dim: 128
      hidden_dim: 128
      predict_continues: true
    tdmpc2:
      batch_size: 128
      continue_loss_scale: 1.0
  smoke:
    encoder:
      encoder_dim: 32
    world_model:
      latent_dim: 32
    tdmpc2:
      mppi_iterations: 2
      population_size: 32
      policy_prior_samples: 8
      num_elites: 8
      batch_size: 8
  gate4:
    context_dim: 3
    encoder:
      encoder_dim: 128
    world_model:
      latent_dim: 128
      hidden_dim: 128  # head width; equals latent_dim for the mlp encoder (upstream)
      predict_continues: true
    tdmpc2:
      batch_size: 128
      continue_loss_scale: 1.0
