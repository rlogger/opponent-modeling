[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opponent-modeling"
version = "0.2.0"
description = "Objective-typed MARL and sequential opponent modeling with GRU-JEPA, belief calibration, BC, and CPL."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26,<3",
    "jax>=0.4.25,<=0.4.38",
    "jaxlib>=0.4.25,<=0.4.38",
    "flax>=0.10,<0.11",
    "chex>=0.1.87,<0.2",
    "optax>=0.2.4,<0.3",
    "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.12,<0.13"]
plot = ["matplotlib>=3.8,<4"]
train = [
    "jaxmarl==0.1.0",
    "hydra-core>=1.3.2,<2",
    "omegaconf>=2.3,<3",
    # 0.1.6+ requires JAX >=0.7, while JaxMARL 0.1.0 caps JAX at 0.4.38.
    "distrax==0.1.5",
    "wandb>=0.19,<0.24",
    "safetensors>=0.5,<0.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
